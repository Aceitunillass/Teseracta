name: Verificar Teseracta ZERO
on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar Godot 4.7.2 oficial y verificar SHA
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT=$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)" >> "$GITHUB_ENV"
      - name: Importar y compilar scripts
        shell: bash
        run: |
          set -o pipefail
          chmod +x "$GODOT"
          "$GODOT" --version
          timeout 120s "$GODOT" --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" godot-import.log; then exit 1; fi
      - name: Arrancar escena y comprobar errores de ejecución
        shell: bash
        run: |
          set -o pipefail
          timeout 60s "$GODOT" --headless --path . --quit-after 30 2>&1 | tee godot-run.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" godot-run.log; then exit 1; fi
