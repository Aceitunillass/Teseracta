name: Comprobaciones del prototipo
on:
  push:
    branches: ["dev/**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar WAV y estructura sin descargar modelos
        run: python -m unittest discover -s tests -v
